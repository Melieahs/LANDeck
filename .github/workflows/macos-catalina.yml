name: macOS 10.15 build

permissions:
  contents: write

on:
  push:
    branches: [feature/macos-catalina]
  workflow_dispatch:

concurrency:
  group: macos-catalina-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Show build resources
        run: |
          df -h /
          sysctl -n hw.memsize
          sw_vers

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: packages/webview_cef/macos/third/cef
          key: cef-118.7.1-macos-x86_64-release-v2

      - name: Prepare CEF 118
        env:
          WEBVIEW_CEF_MACOS_ARCH: x86_64
          CEF_WRAPPER_BUILD_TYPE: Release
        run: |
          echo "sha=$GITHUB_SHA"
          bash packages/webview_cef/macos/scripts/download_cef.sh 2>&1 | tee build-macos.log
          ls -la packages/webview_cef/macos/third/cef >> build-macos.log 2>&1 || true

      - name: Flutter config only
        env:
          WEBVIEW_CEF_MACOS_ARCH: x86_64
          CEF_WRAPPER_BUILD_TYPE: Release
        run: |
          set -euo pipefail
          flutter build macos --release --config-only 2>&1 | tee -a build-macos.log

      - name: Pod install
        env:
          WEBVIEW_CEF_MACOS_ARCH: x86_64
          CEF_WRAPPER_BUILD_TYPE: Release
        run: |
          set -euo pipefail
          cd macos
          pod install 2>&1 | tee -a ../build-macos.log

      - name: Xcode build
        run: |
          set -euo pipefail
          cd macos
          echo "==> linker flags"
          grep -i "OTHER_LDFLAGS" "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig" | tee -a ../build-macos.log || true
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release ARCHS=x86_64 EXCLUDED_ARCHS= \
            -derivedDataPath "$PWD/../build/macos" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a ../build-macos.log
          cd ..

      - name: Package app
        run: |
          set -euo pipefail
          cd build/macos/Build/Products/Release
          ls -la
          app=$(ls -d *.app 2>/dev/null | head -1)
          echo "app=$app"
          if [ -z "$app" ]; then echo "no app produced"; exit 1; fi
          du -sh "$app"
          ls -la "$app/Contents/MacOS" || true
          ditto -c -k --keepParent "$app" LANDeck-macos.zip
          ls -lh LANDeck-macos.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: build-macos.log
          if-no-files-found: ignore

      - name: Publish build log
        if: failure()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          blob=$(git hash-object -w build-macos.log)
          tree=$(printf '100644 blob %s\tmacos-build.log\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "macos build log ${GITHUB_SHA}")
          git push -f origin "$commit:refs/heads/ci-logs/macos"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: LANDeck-macos-10.15
          path: build/macos/Build/Products/Release/LANDeck-macos.zip
          if-no-files-found: error
          retention-days: 14

  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Test
        run: flutter test
