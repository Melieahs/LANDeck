name: Windows build

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-windows.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Output "BUILD_FAILED with exit code $code"; exit $code }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build-windows.log
          if-no-files-found: ignore

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: LANDeck-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Publish build log
        if: failure()
        shell: bash
        run: |
          set -e
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          blob=$(git hash-object -w build-windows.log)
          tree=$(printf '100644 blob %s\twindows-build.log\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "windows build log ${GITHUB_SHA}")
          git push -f origin "$commit:refs/heads/ci-logs/windows"
