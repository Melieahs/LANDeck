name: iOS Simulator Build

permissions:
  contents: write

on:
  push:
    branches: [feature/ios, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug

      - name: Package simulator app
        run: |
          cd build/ios/iphonesimulator
          ditto -c -k --keepParent Runner.app LANDeck-ios-simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: LANDeck-ios-simulator
          path: build/ios/iphonesimulator/LANDeck-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Boot simulator and capture screenshot
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" com.example.landeck
          sleep 8
          mkdir -p screenshots/ios
          xcrun simctl io "$UDID" screenshot screenshots/ios/ios-home.png
          ls -lh screenshots/ios/ios-home.png

      - name: Commit simulator screenshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/ios/ios-home.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
          else
            git commit -m "chore(ios): update simulator screenshot [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
