name: iOS Unsigned IPA

permissions:
  contents: read

on:
  push:
    branches: [feature/ios, feature/ios-settings-cleanup, feature/search-page, main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build unsigned device app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry LANDeck-unsigned.ipa Payload
          ls -lh LANDeck-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LANDeck-unsigned-ipa
          path: build/ios/iphoneos/LANDeck-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
